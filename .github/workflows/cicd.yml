name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - run: docker build -t devops-lab-app ./app

      - run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml