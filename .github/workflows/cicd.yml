name: DevOps CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-lab-app ./app

      - name: Verify Docker image
        run: docker images devops-lab-app